name: Tests

# Hard gate. Tests are the acceptance criteria for code written by people and
# by AI agents alike. A pull request merges only when the suite passes and
# line coverage of src/ stays at or above the floor below.
#
# Coverage shows which lines ran, not whether the assertions would notice a
# wrong result. mutation.yml measures that, on a schedule.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest with coverage floor
        run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=90
